[build]
  # Main marketing / web app site (NOT the invite-only static site).
  command = "npm run export:web"
  publish = "dist"

# Serve required association files with JSON content-type (no redirects)
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

# Some hosts treat dot-directories specially; provide a non-dot mirror
[[headers]]
  for = "/well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[[redirects]]
  from = "/.well-known/apple-app-site-association"
  to = "/well-known/apple-app-site-association"
  status = 200

[[redirects]]
  from = "/.well-known/assetlinks.json"
  to = "/well-known/assetlinks.json"
  status = 200

# Invite deep links (when copied to dist via export:web)
[[redirects]]
  from = "/invite"
  to = "/invite/"
  status = 302

[[redirects]]
  from = "/invite/*"
  to = "/invite/index.html"
  status = 200

